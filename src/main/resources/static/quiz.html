<!DOCTYPE html>
<html>
<head>
<title>Quiz</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg,#eef2ff,#fdf2f8);
    padding:20px;
}

.card {
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

button {
    padding:12px 25px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<h2>Quiz</h2>

<div id="quizContainer"></div>

<button onclick="submitQuiz()">Submit Quiz</button>

<h3 id="result"></h3>

<script>

const params = new URLSearchParams(window.location.search);
const subjectId = params.get("subjectId");

let correctAnswers = {};

fetch(`/api/quiz?subjectId=${subjectId}`)
.then(res => res.json())
.then(data => {

    const container = document.getElementById("quizContainer");

    data.forEach((q, index) => {

        correctAnswers[q.id] = q.correctAnswer;

        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <p><b>Q${index+1}. ${q.question}</b></p>

            <label><input type="radio" name="q${q.id}" value="${q.option1}"> ${q.option1}</label><br>
            <label><input type="radio" name="q${q.id}" value="${q.option2}"> ${q.option2}</label><br>
            <label><input type="radio" name="q${q.id}" value="${q.option3}"> ${q.option3}</label><br>
            <label><input type="radio" name="q${q.id}" value="${q.option4}"> ${q.option4}</label>
        `;

        container.appendChild(div);
    });

});

function submitQuiz() {

    let score = 0;

    for (let qId in correctAnswers) {

        const selected = document.querySelector(`input[name="q${qId}"]:checked`);

        if(selected && selected.value === correctAnswers[qId]) {
            score++;
        }
    }

    document.getElementById("result").innerText = "Score: " + score;
}
</script>

</body>
</html>
